version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: rfq_db_postgres
    restart: always
    environment:
      POSTGRES_DB: RFQ_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rfq_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfq_portal_live
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:Admin%40123@postgres:5432/RFQ_DB
      SECRET_KEY: rfq_portal_super_secret_jwt_key_amaravati_infrastructure_2026
    ports:
      - "8000:8000"

volumes:
  postgres_data:
